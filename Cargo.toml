[package]
name = "bang"
version = "0.1.0"
edition = "2021"
description = "Search from the terminal with engine-native !bangs"
license = "MIT"
repository = "https://github.com/hongnoul/bang"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
ureq = { version = "2", features = ["json"] }
urlencoding = "2"

[profile.release]
strip = true
lto = true
